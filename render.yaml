services:
  - type: web
    name: campus-lost-and-found
    runtime: node
    buildCommand: npm --prefix backend ci
    startCommand: npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: USE_IN_MEMORY_DB
        value: "false"
      - key: MONGODB_DATABASE
        value: campus_lost_found
      - key: MONGODB_URI
        sync: false
      - key: PRIVATE_DATA_KEY
        sync: false
      - key: PRIVATE_DATA_KEY_VERSION
        value: v1
      - key: ADMIN_API_TOKEN
        sync: false
